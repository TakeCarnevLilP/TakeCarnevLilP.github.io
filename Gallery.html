        <script>
        // Modal logic with navigation
        const modal = document.getElementById('imageModal');
        const modalImg = document.getElementById('modalImg');
        const closeBtn = document.querySelector('.close');
        const leftArrow = document.querySelector('.modal-arrow.left');
        const rightArrow = document.querySelector('.modal-arrow.right');
        const images = Array.from(document.querySelectorAll('.image-item img'));
        let currentIndex = 0;

        function showModal(index) {
            currentIndex = index;
            modal.style.display = 'block';
            modalImg.src = images[index].src;
            modalImg.alt = images[index].alt;
        }

        images.forEach((img, idx) => {
            img.addEventListener('click', function() {
                showModal(idx);
            });
        });

        closeBtn.onclick = function() {
            modal.style.display = 'none';
            modalImg.src = '';
        }

        leftArrow.onclick = function(e) {
            e.stopPropagation();
            currentIndex = (currentIndex - 1 + images.length) % images.length;
            showModal(currentIndex);
        }

        rightArrow.onclick = function(e) {
            e.stopPropagation();
            currentIndex = (currentIndex + 1) % images.length;
            showModal(currentIndex);
        }

        window.onclick = function(event) {
            if (event.target === modal) {
                modal.style.display = 'none';
                modalImg.src = '';
            }
        }

        window.addEventListener('keydown', function(e) {
            if (modal.style.display === 'block') {
                if (e.key === 'ArrowLeft') {
                    currentIndex = (currentIndex - 1 + images.length) % images.length;
                    showModal(currentIndex);
                } else if (e.key === 'ArrowRight') {
                    currentIndex = (currentIndex + 1) % images.length;
                    showModal(currentIndex);
                } else if (e.key === 'Escape') {
                    modal.style.display = 'none';
                    modalImg.src = '';
                }
            }
        });
        </script>
        <style>
            .modal {
                display: none;
                position: fixed;
                z-index: 1000;
                left: 0;
                top: 0;
                width: 100vw;
                height: 100vh;
                overflow: auto;
                animation: fadeIn 0.3s;
            }
            .modal-content {
                display: block;
                margin: 5vh auto;
                max-width: 90vw;
                max-height: 80vh;
                border-radius: 18px;
                box-shadow: 0 8px 32px 0 rgba(57,255,20,0.32);
                background: #18120f;
                border: 6px solid #ffa704;
                animation: scaleUp 0.3s;
            }
            .close {
                position: absolute;
                top: 32px;
                right: 48px;
                color: #f18900;
                font-size: 48px;
                font-weight: 300;
                cursor: pointer;
                z-index: 1001;
                transition: color 0.2s;
                text-shadow: 2px 2px 8px #000;
            }
            .close:hover {
                color: #fff;
            }
            .modal-arrow {
                position: absolute;
                top: 50%;
                transform: translateY(-50%);
                color: #f18900;
                font-size: 64px;
                font-weight: 300;
                cursor: pointer;
                z-index: 1001;
                user-select: none;
                padding: 0 24px;
                transition: color 0.2s;
                text-shadow: 2px 2px 8px #000;
            }
            .modal-arrow.left {
                left: 0;
            }
            .modal-arrow.right {
                right: 0;
            }
            .modal-arrow:hover {
                color: #fff;
            }
            @keyframes fadeIn {
                from { opacity: 0; }
                to { opacity: 1; }
            }
            @keyframes scaleUp {
                from { transform: scale(0.95); }
                to { transform: scale(1); }
            }
